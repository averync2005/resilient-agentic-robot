[project]
name = "capstone"
version = "0.1.0"
description = "Cloud and edge agents for the Resilient Cloud-to-Edge Agentic Robotic System capstone project. A hosted-LLM cloud agent plans robot actions, and a local Gemma 4 edge agent on the Jetson Orin Nano validates and executes them, communicating over A2A."
readme = "README.md"
# GitHub: Avery Nudell-Cook (averync2005), Ali Mohrez (Ali-Mohrez)
# Faculty advisor / repo collaborator: Eric Obeysekare (ero5004)
authors = [
    { name = "Avery Nudell-Cook" },
    { name = "Ali Mohrez" },
]
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.29.0",
    "langchain>=1.4.1",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "openai>=3.15.0",
    "pydantic-settings>=2.15.0",
    "python-a2a>=0.5.10",
    "python-dotenv>=1.2.3",
]

[project.scripts]
cloud-agent = "capstone.cloud_agent:main"
cloud-agent-dev = "capstone.cloud_agent:dev"
edge-agent = "capstone.edge_agent:main"
edge-agent-check = "capstone.edge_agent:check"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
